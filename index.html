<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ocarina of Time Countdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#0b1a14;--sky2:#17311f;--stone1:#6d7068;--stone2:#4a4d47;--stone3:#34372f;--gold:#f0cf5a;--moss:#4f7a35;--ink:#e9efdc;--muted:#a9b79f;--m1:#1d3a2c;--m2:#234a30;--m3:#2c5a35;--m4:#1b3a22;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--sky1:#cfe3c4;--sky2:#8fb67a;--ink:#1f2a1a;--muted:#2f4128;--m1:#7da08a;--m2:#6a9a5c;--m3:#5a8a46;--m4:#3f6b2b}}
:root[data-theme="light"]{--sky1:#cfe3c4;--sky2:#8fb67a;--ink:#1f2a1a;--muted:#2f4128;--m1:#7da08a;--m2:#6a9a5c;--m3:#5a8a46;--m4:#3f6b2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);font-family:Cinzel,Georgia,serif;text-align:center;
background:#0b1a14;display:flex;align-items:center;justify-content:center;position:relative}
main{position:relative;z-index:2;padding:28px 16px;width:100%;max-width:780px}
h1{font-size:clamp(1.2rem,4.6vw,2rem);margin:6px 0 4px;color:var(--gold);letter-spacing:.06em;text-shadow:0 2px 6px #000a}
.ruin{position:relative;padding:26px 14px 20px;border-radius:6px;
background:linear-gradient(180deg,var(--stone1),var(--stone2) 40%,var(--stone3));
box-shadow:inset 0 0 0 3px #00000040,inset 0 0 40px #000000a0,0 14px 30px #000a}
.ruin::before,.ruin::after{content:"";position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,#00000030 0 2px,transparent 2px 46px)}
.ruin::before{top:6px}.ruin::after{bottom:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}
.box{position:relative;padding:18px 2px 12px;border-radius:4px;background:linear-gradient(160deg,#3b3e37,#23251f);box-shadow:inset 0 0 0 2px #0008,inset 0 2px 0 #ffffff1a,0 3px 0 #0006}
.num{font-size:clamp(1.8rem,9vw,3.4rem);font-weight:700;color:var(--gold);line-height:1;text-shadow:0 0 12px #f0cf5a80,0 2px 0 #000}
.lab{font-size:clamp(.55rem,2.2vw,.72rem);letter-spacing:clamp(.06em,.8vw,.2em);text-transform:uppercase;color:#b9c4ad;margin-top:8px}
.crack{position:absolute;width:34px;height:34px;opacity:.55;pointer-events:none}
.v{position:absolute;pointer-events:none;z-index:3;overflow:visible}
.fl{position:absolute;width:6px;height:6px;border-radius:50%;background:#bfffa0;box-shadow:0 0 10px 4px #9be67a;z-index:1;animation:fl 9s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(30px,-50px);opacity:1}}
.done{display:none;font-size:1.7rem;color:var(--gold);font-weight:700;padding:30px 0;text-shadow:0 0 14px #f0cf5a}
.note{margin-top:22px;font-size:.8rem;color:var(--muted);font-family:Georgia,serif}

<script>
var target=new Date(2026,10,5,0,0,0);
function pad(n){return String(n).padStart(2,"0")}
function tick(){
var diff=target-new Date();
if(diff<=0){document.getElementById("grid").style.display="none";document.getElementById("done").style.display="block";return}
var t=Math.floor(diff/1000);
document.getElementById("d").textContent=Math.floor(t/86400);
document.getElementById("h").textContent=pad(Math.floor(t%86400/3600));
document.getElementById("m").textContent=pad(Math.floor(t%3600/60));

}
