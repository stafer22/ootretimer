<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Ocarina of Time Countdown</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&display=swap" rel="stylesheet">
<style>
:root{--sky1:#0b1a14;--sky2:#17311f;--stone1:#6d7068;--stone2:#4a4d47;--stone3:#34372f;--gold:#f0cf5a;--moss:#4f7a35;--ink:#e9efdc;--muted:#a9b79f;--m1:#1d3a2c;--m2:#234a30;--m3:#2c5a35;--m4:#1b3a22;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:light){:root:not([data-theme="dark"]){--sky1:#cfe3c4;--sky2:#8fb67a;--ink:#1f2a1a;--muted:#2f4128;--m1:#7da08a;--m2:#6a9a5c;--m3:#5a8a46;--m4:#3f6b2b}}
:root[data-theme="light"]{--sky1:#cfe3c4;--sky2:#8fb67a;--ink:#1f2a1a;--muted:#2f4128;--m1:#7da08a;--m2:#6a9a5c;--m3:#5a8a46;--m4:#3f6b2b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;min-height:100vh;overflow-x:hidden;color:var(--ink);font-family:Cinzel,Georgia,serif;text-align:center;
background:#0b1a14;display:flex;align-items:center;justify-content:center;position:relative}
main{position:relative;z-index:2;padding:28px 16px;width:100%;max-width:780px}
h1{font-size:clamp(1.2rem,4.6vw,2rem);margin:6px 0 4px;color:var(--gold);letter-spacing:.06em;text-shadow:0 2px 6px #000a}
.ruin{position:relative;padding:26px 14px 20px;border-radius:6px;
background:linear-gradient(180deg,var(--stone1),var(--stone2) 40%,var(--stone3));
box-shadow:inset 0 0 0 3px #00000040,inset 0 0 40px #000000a0,0 14px 30px #000a}
.ruin::before,.ruin::after{content:"";position:absolute;left:0;right:0;height:10px;background:repeating-linear-gradient(90deg,#00000030 0 2px,transparent 2px 46px)}
.ruin::before{top:6px}.ruin::after{bottom:6px}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;position:relative}
.box{position:relative;padding:18px 2px 12px;border-radius:4px;background:linear-gradient(160deg,#3b3e37,#23251f);box-shadow:inset 0 0 0 2px #0008,inset 0 2px 0 #ffffff1a,0 3px 0 #0006}
.num{font-size:clamp(1.8rem,9vw,3.4rem);font-weight:700;color:var(--gold);line-height:1;text-shadow:0 0 12px #f0cf5a80,0 2px 0 #000}
.lab{font-size:clamp(.55rem,2.2vw,.72rem);letter-spacing:clamp(.06em,.8vw,.2em);text-transform:uppercase;color:#b9c4ad;margin-top:8px}
.crack{position:absolute;width:34px;height:34px;opacity:.55;pointer-events:none}
.v{position:absolute;pointer-events:none;z-index:3;overflow:visible}
.fl{position:absolute;width:6px;height:6px;border-radius:50%;background:#bfffa0;box-shadow:0 0 10px 4px #9be67a;z-index:1;animation:fl 9s ease-in-out infinite}
@keyframes fl2{0%,100%{transform:translate(0,0);opacity:.25}50%{transform:translate(-36px,-42px);opacity:1}}
@keyframes fl{0%,100%{transform:translate(0,0);opacity:.2}50%{transform:translate(30px,-50px);opacity:1}}
.done{display:none;font-size:1.7rem;color:var(--gold);font-weight:700;padding:30px 0;text-shadow:0 0 14px #f0cf5a}
.note{margin-top:22px;font-size:.8rem;color:var(--muted);font-family:Georgia,serif}
.snd{display:inline-flex;align-items:center;gap:8px;margin-top:22px;padding:9px 18px;font:600 .72rem Cinzel,Georgia,serif;letter-spacing:.14em;text-transform:uppercase;color:#d9e2cc;background:linear-gradient(180deg,#4a4d47,#2b2d27);border:0;border-radius:4px;box-shadow:inset 0 0 0 2px #0008,inset 0 1px 0 #ffffff22,0 3px 0 #0006;cursor:pointer}
.snd:hover{color:var(--gold)}.snd:focus-visible{outline:2px solid var(--gold);outline-offset:3px}.snd svg{width:16px;height:16px}

.stage{position:fixed;left:50%;top:50%;width:max(100vw,177.78vh);height:max(100vh,56.25vw);transform:translate(-50%,-50%);z-index:0;overflow:hidden;pointer-events:none}
.stage i{position:absolute;inset:0;background:var(--bg) 0 0/100% 100%;will-change:transform}
.stage .cur,.stage .cur2{-webkit-mask-composite:source-in;mask-composite:intersect}
.stage .cur{-webkit-mask-image:linear-gradient(90deg,transparent 57%,#000 63%,#000 85%,transparent 91%),linear-gradient(180deg,#000 0,#000 75%,transparent 97%);mask-image:linear-gradient(90deg,transparent 57%,#000 63%,#000 85%,transparent 91%),linear-gradient(180deg,#000 0,#000 75%,transparent 97%);transform-origin:75% 0;animation:sway 5.2s ease-in-out infinite}
.stage .cur2{-webkit-mask-image:linear-gradient(90deg,transparent 57%,#000 63%,#000 85%,transparent 91%),linear-gradient(180deg,transparent 28%,#000 52%,#000 82%,transparent 97%);mask-image:linear-gradient(90deg,transparent 57%,#000 63%,#000 85%,transparent 91%),linear-gradient(180deg,transparent 28%,#000 52%,#000 82%,transparent 97%);transform-origin:75% 55%;animation:sway2 6.8s ease-in-out infinite}
@keyframes sway{0%,100%{transform:skewX(-.4deg) translateX(-.1%)}22%{transform:skewX(1.5deg) translateX(.45%)}38%{transform:skewX(.6deg) translateX(.15%)}62%{transform:skewX(2deg) translateX(.62%)}80%{transform:skewX(.2deg) translateX(0)}}
@keyframes sway2{0%,100%{transform:translateX(.2%) skewX(.5deg)}30%{transform:translateX(-.6%) skewX(-1.2deg)}48%{transform:translateX(-.1%) skewX(-.3deg)}72%{transform:translateX(-.78%) skewX(-1.6deg)}}
.shade{position:fixed;inset:0;z-index:0;pointer-events:none;background:radial-gradient(ellipse 55% 50% at 50% 52%,#000a 0%,#0000 100%),linear-gradient(180deg,#0006 0%,#0002 45%,#0008 100%)}
.logo{position:relative;width:min(88%,540px);aspect-ratio:2300/1700;margin:0 auto 34px;background:var(--logo) center/contain no-repeat;filter:drop-shadow(0 4px 12px #000c)}
.logo::after{content:"";position:absolute;inset:0;-webkit-mask:var(--logo) center/contain no-repeat;mask:var(--logo) center/contain no-repeat;background:linear-gradient(110deg,transparent 42%,rgba(255,250,225,0) 44%,rgba(255,250,225,.7) 50%,rgba(255,250,225,0) 56%,transparent 58%) 100% 0/250% 100% no-repeat;animation:shine 8s ease-in-out infinite}
@keyframes shine{0%,70%{background-position:100% 0}100%{background-position:0 0}}
@media (prefers-reduced-motion:reduce){.stage i,.logo::after,.fl{animation:none}}
.stage .lf{position:absolute;display:block;will-change:transform;animation:flutter var(--t,4s) ease-in-out var(--d,0s) infinite}
@keyframes flutter{0%,100%{transform:rotate(calc(var(--a)*-.5))}25%{transform:rotate(var(--a))}45%{transform:rotate(calc(var(--a)*.15))}70%{transform:rotate(calc(var(--a)*1.1))}}
@media (prefers-reduced-motion:reduce){.stage .lf{animation:none}}
</style>

function loadTick(){
if(tickBuf||!ctx)return;
var bin=atob(TICK_B64),u=new Uint8Array(bin.length);
for(var i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);
ctx.decodeAudioData(u.buffer,function(b){tickBuf=b},function(){});
}
var lastClick=0;
function click(){
if(!soundOn||!ctx||!tickBuf)return;
var nw=performance.now();if(nw-lastClick<700)return;lastClick=nw;
var src=ctx.createBufferSource();src.buffer=tickBuf;
var g=ctx.createGain();g.gain.value=.22;
src.connect(g);g.connect(ctx.destination);src.start();
}
document.getElementById("snd").addEventListener("click",function(){
try{
if(!ctx){var AC=window.AudioContext||window.webkitAudioContext;ctx=new AC()}
if(ctx.state==="suspended")ctx.resume();
}catch(e){return}
soundOn=!soundOn;
loadTick();
this.setAttribute("aria-pressed",soundOn);
document.getElementById("sndl").textContent=soundOn?"Sound on":"Sound off";
document.getElementById("wave").style.display=soundOn?"":"none";
});
function pad(n){return String(n).padStart(2,"0")}
function tick(){
var diff=target-new Date();
if(diff<=0){document.getElementById("grid").style.display="none";document.getElementById("done").style.display="block";return}
var t=Math.floor(diff/1000);
document.getElementById("d").textContent=Math.floor(t/86400);
document.getElementById("h").textContent=pad(Math.floor(t%86400/3600));
document.getElementById("m").textContent=pad(Math.floor(t%3600/60));
document.getElementById("s").textContent=pad(t%60);
if(t!==lastT){lastT=t;click()}
}
var lastT=-1;
function loop(){
tick();
var d=target-new Date();
if(d<=0)return;
setTimeout(loop,(d%1000)+3);
}
loop();
